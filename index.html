  $('#main').innerHTML=pre+'<p style="color:var(--mut)">كل تغيير بيتسجل هون، وبتقدر تتراجع عنه بضغطة.</p>'+errBox(P)+(L.length?L.map(h=>`<div class="log"><b>${esc(h.txt)}</b> <span class="tag">${esc(mname(h.m))}</span>${h.undone?' <span class="tag no">تم التراجع</span>':''}<br><small>${esc(h.byName)} · ${new Date(h.t).toLocaleString('ar')}</small>${h.undone||h.kind==='undo'?'':`<div class="tools" style="margin:8px 0 0"><button class="btn alt s" data-u="${h.id}">تراجع عن هذه الخطوة</button></div>`}</div>`).join(''):(P.busy?'<div class="empty">جاري التحميل…</div>':'<div class="empty">لا توجد تغييرات</div>'))+moreBtn(P);
  bsub();bmore(P);document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{if(confirm('التراجع عن هذه الخطوة؟'))undo(L.find(x=>x.id===b.dataset.u))})}}
function vEv(){
 if(!isM()){try{localStorage.setItem('ns_'+ME.u,Date.now())}catch(e){}const L=D.rq.filter(r=>r.st!=='pending').sort((a,b)=>(b.dt||0)-(a.dt||0));
  $('#main').innerHTML='<p style="color:var(--mut)">قرارات المدير على طلباتك.</p>'+(L.length?L.map(r=>`<div class="log"><b>طلب ${RT[r.type]}: ${esc(r.pname||'')}</b> <span class="tag ${r.st==='ok'?'ok':'no'}">${r.st==='ok'?'مقبول':'مرفوض'}</span>${r.why?'<br>السبب: '+esc(r.why):''}<br><small>${r.dt?new Date(r.dt).toLocaleString('ar'):''}</small></div>`).join(''):'<div class="empty">لا توجد إشعارات</div>');return}
 const P=pager('ev','e',[()=>DB.collection('ev').orderBy('t','desc')]),L=P.rows;
 $('#main').innerHTML=`<div class="tools"><b>الإشعارات (${D.ev.length>=100?'100+':D.ev.length} غير مقروءة)</b><button class="btn alt" id="sn">تحديد الكل كمقروء</button></div>${errBox(P)}`+(L.length?L.map(e=>`<div class="log ${e.seen?'':'new'}">${esc(e.txt)}<br><small>${esc(e.by)} · ${new Date(e.t).toLocaleString('ar')}</small></div>`).join(''):(P.busy?'<div class="empty">جاري التحميل…</div>':'<div class="empty">لا توجد إشعارات</div>'))+moreBtn(P);
 bmore(P);$('#sn').onclick=async()=>{try{const b=DB.batch();D.ev.forEach(e=>b.update(DB.doc('ev/'+e.id),{seen:true}));await ack(b.commit());P.rows.forEach(e=>e.seen=true);draw()}catch(e){toast('تعذر التحديد')}}}
function vUsr(pre){
 $('#main').innerHTML=pre+`<div class="card"><h2>إنشاء حساب</h2><div class="f"><label>الاسم<input id="u_n"></label><label>الجوال<input id="u_t" inputmode="tel"></label><label>اسم المستخدم (إنجليزي)<input id="u_u" dir="ltr"></label><label>كلمة المرور<input id="u_p"></label><label>الصلاحية<select id="u_r"><option value="member">عضو</option>${isM()?'<option value="admin">إداري</option>':''}</select></label><label>المسجد (للعضو)<select id="u_m">${mopts('')}</select></label></div><div class="tools" style="margin-top:12px"><button class="btn" id="u_ok">إنشاء</button></div></div>
 <div class="card tw"><h2>الحسابات</h2><table><tr><th>الاسم</th><th>المستخدم</th><th>الصلاحية</th><th>المسجد</th><th>الجوال</th><th></th></tr>${D.ac.map(a=>`<tr><td>${esc(a.name)}</td><td dir="ltr">${esc(a.u)}</td><td>${RN[a.role]}</td><td>${a.role==='member'?esc(mname(a.m)):'—'}</td><td>${esc(a.phone)}</td><td>${isM()&&a.u!==ME.u?`<button class="btn red s" data-x="${a.u}">حذف</button>`:''}</td></tr>`).join('')}</table></div>`;
 $('#u_ok').onclick=async()=>{const u=$('#u_u').value.trim().toLowerCase(),p=$('#u_p').value,n=$('#u_n').value.trim(),role=$('#u_r').value;if(!/^[a-z0-9_.-]{3,}$/.test(u)||p.length<6||!n)return toast('أكمل البيانات (كلمة المرور 6 أحرف على الأقل)');
  try{await mkAcct({u,pw:p,name:n,phone:$('#u_t').value.trim(),role,m:role==='member'?$('#u_m').value:''});ev('إنشاء حساب '+RN[role]+': '+n);toast('تم إنشاء الحساب')}catch(e){toast(e.code==='auth/email-already-in-use'?'اسم المستخدم مستخدم سابقاً':'تعذر الإنشاء')}};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const a=D.ac.find(x=>x.u===b.dataset.x);if(confirm('حذف حساب '+a.name+'؟ لا يمكن إعادة استخدام اسم المستخدم.')){del('ac',a.u);ev('حذف حساب '+a.name)}})}

function vSet(){
 const items=setItems();if(!items.find(x=>x[0]===sub.set))sub.set=items[0][0];const pre=subnav('set',items);
 if(sub.set==='users')vUsr(pre);
 else if(sub.set==='pw')vPw(pre);

 else if(sub.set==='trash'||sub.set==='hist')vBin(pre);
 else if(sub.set==='cfg'){
  $('#main').innerHTML=pre+`<div class="card"><h2>المساجد</h2>${CF.mosques.map(m=>`<div class="tools"><input data-r="${m.id}" value="${esc(m.name)}" style="flex:1"><span class="tag">${sd('t_'+m.id)} أسرة</span></div>`).join('')}</div>
  <div class="card"><h2>نص رسالة المستفيدين</h2><textarea id="sm" rows="3" style="width:100%">${esc(CF.sms)}</textarea><small>المتغيرات: {الاسم} {المسجد}</small><div class="tools" style="margin-top:8px"><button class="btn" id="ss">حفظ</button></div></div>`;
  document.querySelectorAll('[data-r]').forEach(i=>i.onchange=()=>{if(i.value.trim())set('cf',{id:'main',...CF,mosques:CF.mosques.map(m=>m.id===i.dataset.r?{...m,name:i.value.trim()}:m)})});
  $('#ss').onclick=()=>{set('cf',{id:'main',...CF,sms:$('#sm').value});toast('تم الحفظ')}}
 else{$('#main').innerHTML=pre+`<div class="card"><h2>النسخ الاحتياطي</h2><p style="margin:0 0 10px;color:var(--mut)">آخر نسخة: ${CF.lastBackup||'لم تؤخذ بعد'}. النسخة الكاملة فيها السكان والسلة والمستفيدين والإحصائيات، وبتنفع للاسترجاع.</p><div class="tools" style="margin:0"><button class="btn" id="bj">تنزيل نسخة كاملة</button><button class="btn alt" id="rs">استرجاع من نسخة</button></div><input type="file" id="rf" accept=".json" hidden></div>
  <div class="card"><h2>صيانة البيانات</h2><p style="margin:0 0 10px;color:var(--mut)">فحص كل السجلات، وإصلاح الحقول، وإعادة بناء الإحصائيات. استخدمه بعد أي استرجاع أو إذا بدت الأرقام غير صحيحة، وبعد نقل بيانات من نسخة قديمة.</p><button class="btn alt" id="rc">فحص وإعادة بناء الإحصائيات</button></div>`;
  $('#bj').onclick=backupJSON;$('#rs').onclick=()=>$('#rf').click();$('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreJSON(f)};$('#rc').onclick=recount}
 bsub()}

let AU,UN=[];const ld=u=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)});
async function libs(){for(const b of ['https://www.gstatic.com/firebasejs/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/','https://unpkg.com/firebase@10.12.2/']){try{for(const n of ['app','auth','firestore'])await ld(b+'firebase-'+n+'-compat.js');if(window.firebase)return true}catch(e){}}return false}
const on=(q,c,cb)=>UN.push(q.onSnapshot(s=>{if(cb)cb(s);else D[c]=s.docs.map(d=>d.data());rdy[c]=1;rd()},e=>{console.error(c,e);toast('تعذر تحميل '+c+': '+(e.code||''))}));
async function boot0(){
 if(typeof firebase==='undefined'&&!(await libs())){$('#main').innerHTML='<div class="empty">تعذر تحميل مكتبة Firebase من الإنترنت.<br>افتح الرابط في متصفح Chrome (وليس من داخل تطبيق)، وجرّب شبكة أخرى أو VPN.</div>';return}
 if(typeof XLSX==='undefined')ld('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').catch(()=>{});
 firebase.initializeApp(FIREBASE_CONFIG);AU=firebase.auth();DB=firebase.firestore();
 DB.settings({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED});try{await DB.enablePersistence({synchronizeTabs:true})}catch(e){console.warn('persistence',e.code)}
 PEND++;DB.waitForPendingWrites().then(()=>{PEND=Math.max(0,PEND-1);setNet()});
 window.addEventListener('offline',()=>{setNet();toast('انقطع الاتصال. كمّل شغلك، والتعديلات بتنحفظ وبتنرفع تلقائياً.')});window.addEventListener('online',()=>{setNet();toast('رجع الاتصال، جاري رفع التعديلات…')});
 AU.onAuthStateChanged(async u=>{UN.forEach(f=>f());UN=[];ME=null;rdy={};PG={};D={ac:[],rq:[],ev:[]};SD={};$('#hd').innerHTML='';
  if(!u){$('#nav').innerHTML='';login();return}
  const un=u.email.split('@')[0];let a;try{a=(await DB.doc('ac/'+un).get(GO())).data()}catch(e){}
  if(!a){if(!navigator.onLine){$('#main').innerHTML='<div class="empty">لا يوجد اتصال بالإنترنت وهذا أول تشغيل على هذا الجهاز.<br>اتصل بالإنترنت مرة واحدة لتجهيزه.</div>';return}toast('الحساب غير مفعّل');AU.signOut();return}
  ME=a;const C=c=>DB.collection(c),mem=a.role==='member';
  if(mem)UN.push(DB.doc('ac/'+un).onSnapshot(s=>{ME=s.data();D.ac=[ME];rdy.ac=1;rd()}));else on(C('ac'),'ac');
  on(mem?C('rq').where('by','==',un).limit(100):C('rq').where('st','==','pending').limit(300),'rq');
  if(a.role==='manager')on(C('ev').where('seen','==',false).limit(100),'ev');
  on(DB.doc('st/main'),'st',s=>{SD=s.exists?s.data():{}});
  UN.push(DB.doc('cf/main').onSnapshot(s=>{if(s.exists){const c=s.data();CF={mosques:c.mosques||CF.mosques,sms:c.sms||CF.sms,lastBackup:c.lastBackup||''}}else if(a.role==='manager')set('cf',{id:'main',...CF});rdy.cf=1;rd()},e=>toast('خطأ: '+(e.code||''))));
  draw()})}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot0();
