<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تكافل – نظام لجنة الإغاثة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#12302b;--bg:#f2f5f4;--card:#fff;--line:#d3dcd9;--mut:#5d716c;--acc:#c9892b;--acc2:#12302b;--bad:#b3402f;--ok:#2f7d4f;--soft:#e4efec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--ink:#e6efec;--bg:#0f1b19;--card:#172724;--line:#2a3f3b;--mut:#98ada8;--acc:#e0a248;--acc2:#2f7d6b;--soft:#1f3532}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6efec;--bg:#0f1b19;--card:#172724;--line:#2a3f3b;--mut:#98ada8;--acc:#e0a248;--acc2:#2f7d6b;--soft:#1f3532}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--acc2);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:800}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--mut)}
nav button.on{border-color:var(--acc);color:var(--ink);font-weight:800}
nav b{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi span{color:var(--mut);font-size:13px}.kpi div{font-size:30px;font-weight:800;line-height:1.2}
.kpi.big{background:var(--acc2);color:#fff;border:0}.kpi.big span{color:#ffffffbb}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.bar i{display:block;height:12px;border-radius:6px;background:var(--acc)}.bar u{background:var(--soft);border-radius:6px;display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{background:var(--acc2);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.gold{background:var(--acc);color:#1b1304}.btn.red{background:var(--bad)}.btn.s{padding:3px 10px;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--soft);text-align:right;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--line)}
.tag{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:12px;white-space:nowrap}.tag.ok{background:var(--ok);color:#fff}.tag.no{background:var(--bad);color:#fff}.tag.w{background:var(--acc);color:#1b1304}
.log{border-inline-start:4px solid var(--line);padding:6px 12px;margin:8px 0}.log.new{border-color:var(--acc);background:var(--soft)}.log small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(460px,94vw);padding:16px}dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:grid;gap:3px;font-size:13px;color:var(--mut)}.f .w{grid-column:1/-1}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9;max-width:90vw}
a.sms{color:var(--ok);font-weight:700;text-decoration:none}
.login{max-width:380px;margin:30px auto}
@media(max-width:520px){.bar{grid-template-columns:80px 1fr 36px}.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>تكافل</h1><div id="hd" class="tools" style="margin:0"></div></header>
<nav id="nav"></nav><main id="main"><div class="empty">جاري التحميل…</div></main>
<dialog id="dlg"></dialog><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden><div id="toast"></div>
<script>
// الصق هنا إعدادات مشروع Firebase (Project settings > Your apps)
const FIREBASE_CONFIG={apiKey:'',authDomain:'',projectId:'',storageBucket:'',messagingSenderId:'',appId:''};
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toISOString().slice(0,10);
const RN={manager:'مدير',admin:'إداري',member:'عضو'},ST=['محتاج','أرمل/ة','أيتام','مريض','كبير سن','عادي'],PR=['عالية','متوسطة','عادية'],AT=['كابونة','طرد غذائي','مساعدة نقدية','بطانيات','أخرى'],RT={add:'إضافة',edit:'تعديل',del:'حذف',imp:'استيراد'};
const MN=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
let DB,ME=null,D={pp:[],ac:[],rq:[],ai:[],ev:[]},rdy={},tab='stats',fm='all',fa='all',q='',ex=new Set(),SR={};
let CF={mosques:MN.map((n,i)=>({id:'m'+(i+1),name:'المسجد '+n})),sms:'السلام عليكم {الاسم}، تم ترشيحكم لاستلام مساعدة من لجنة الإغاثة. نرجو مراجعة المسجد.'};
const mname=id=>(CF.mosques.find(m=>m.id===id)||{name:'—'}).name,isM=()=>ME.role==='manager',all=()=>ME.role!=='member';
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)};
const set=(c,o)=>DB.doc(c+'/'+o.id).set(o).catch(()=>toast('تعذر الحفظ')),del=(c,id)=>DB.doc(c+'/'+id).delete().catch(()=>toast('تعذر الحذف'));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ev=t=>set('ev',{id:uid('e'),t:Date.now(),txt:t,by:ME.name,seen:false});
const sec=()=>firebase.initializeApp(FIREBASE_CONFIG,'s'+Date.now()),fin=a=>{a.auth().signOut().catch(()=>{});a.delete().catch(()=>{})};
async function mkAcct(o){const a=sec();try{await a.auth().createUserWithEmailAndPassword(o.u+'@relief.app',o.pw);await set('ac',{id:o.u,u:o.u,name:o.name,phone:o.phone,role:o.role,m:o.m||'',t:Date.now()})}finally{fin(a)}}
async function boot(o){const a=sec();try{await a.auth().createUserWithEmailAndPassword(o.u+'@relief.app',o.pw);const f=a.firestore(),b=f.batch();b.set(f.doc('ac/'+o.u),{id:o.u,u:o.u,name:o.name,phone:o.phone,role:'manager',m:'',t:Date.now()});b.set(f.doc('cf/boot'),{id:'boot',t:Date.now()});await b.commit()}finally{fin(a)}}
const dl=(n,b)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};
const mopts=(v,a)=>(a?'<option value="all">كل المساجد</option>':'')+CF.mosques.map(m=>`<option value="${m.id}" ${v===m.id?'selected':''}>${esc(m.name)}</option>`).join('');
const vis=()=>D.pp.filter(p=>all()?(fm==='all'||p.m===fm):p.m===ME.m);
const rd=()=>{if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;draw()};
function mbar(){return all()?`<select id="fm">${mopts(fm,1)}</select>`:`<span class="tag">${esc(mname(ME.m))}</span>`}
function bfm(){const e=$('#fm');if(e)e.onchange=()=>{fm=e.value;draw()}}
function draw(){
 if(!ME||!(rdy.ac&&rdy.cf))return;
 $('#hd').innerHTML=ME?`<span>${esc(ME.name)} · ${RN[ME.role]}${ME.role==='member'?' · '+esc(mname(ME.m)):''}</span><button class="btn alt s" id="pw">كلمة المرور</button><button class="btn alt s" id="lo">خروج</button>`:'';
 if(!ME)return login();
 $('#pw').onclick=pwDlg;$('#lo').onclick=()=>AU.signOut();
 const pe=D.rq.filter(r=>r.st==='pending').length,ue=D.ev.filter(e=>!e.seen).length,b=n=>n?`<b>${n}</b>`:'';
 const T=[['stats','الإحصائيات'],['people','السكان'],['nom','الترشيح والاستلام'],['aid','المستفيدون'],['req','طلبات الاعتماد'+(isM()?b(pe):'')]];
 if(all())T.push(['usr','الحسابات']);if(isM())T.push(['ev','الإشعارات'+b(ue)],['set','الإعدادات']);
 if(!T.find(t=>t[0]===tab))tab='stats';
 $('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;draw()});
 ({stats:vStats,people:vPeople,nom:vNom,aid:vAid,req:vReq,usr:vUsr,ev:vEv,set:vSet})[tab]();
}
function login(){
 $('#main').innerHTML=`<div class="card login"><h2>تسجيل الدخول</h2><div class="f"><label class="w">اسم المستخدم<input id="l_u" dir="ltr"></label><label class="w">كلمة المرور<input id="l_p" type="password"></label></div><div class="tools" style="margin-top:12px"><button class="btn" id="l_ok">دخول</button><button class="btn alt s" id="l_s">أول تشغيل؟ إنشاء المدير</button></div></div>`;
 const go=async()=>{try{await AU.signInWithEmailAndPassword($('#l_u').value.trim().toLowerCase()+'@relief.app',$('#l_p').value)}catch(e){toast('بيانات الدخول غير صحيحة')}};
 $('#l_ok').onclick=go;$('#l_p').onkeydown=e=>{if(e.key==='Enter')go()};$('#l_s').onclick=setup}
function setup(){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">إنشاء حساب المدير (مرة واحدة)</h2><div class="f"><label class="w">الاسم<input id="a_n"></label><label>اسم المستخدم (إنجليزي)<input id="a_u" dir="ltr"></label><label>كلمة المرور (6+)<input id="a_p" type="password"></label><label class="w">الجوال<input id="a_t"></label></div><div class="tools" style="margin:14px 0 0"><button class="btn" id="ok">إنشاء</button><button class="btn alt" id="no">إلغاء</button></div>`;d.showModal();$('#no').onclick=()=>d.close();
 $('#ok').onclick=async()=>{const u=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value,n=$('#a_n').value.trim();if(!/^[a-z0-9_.-]{3,}$/.test(u)||p.length<6||!n)return toast('أكمل البيانات (كلمة المرور 6 أحرف على الأقل)');
  try{await boot({u,pw:p,name:n,phone:$('#a_t').value.trim()});d.close();toast('تم. سجّل الدخول الآن')}catch(e){toast(e.code==='auth/email-already-in-use'?'اسم المستخدم مستخدم':'تمت التهيئة مسبقاً أو حدث خطأ')}}}
function pwDlg(){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">تغيير كلمة المرور</h2><div class="f"><label class="w">الحالية<input id="o" type="password"></label><label class="w">الجديدة (6+)<input id="n" type="password"></label></div><div class="tools" style="margin:14px 0 0"><button class="btn" id="ok">حفظ</button><button class="btn alt" id="no">إلغاء</button></div>`;d.showModal();$('#no').onclick=()=>d.close();
 $('#ok').onclick=async()=>{const n=$('#n').value;if(n.length<6)return toast('6 أحرف على الأقل');try{const u=AU.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,$('#o').value));await u.updatePassword(n);ev('قام بتغيير كلمة المرور الخاصة به');d.close();toast('تم التغيير')}catch(e){toast('كلمة المرور الحالية خطأ')}}}
const bars=(o,mx)=>Object.entries(o).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><u><i style="width:${mx?Math.round(v/mx*100):0}%"></i></u><b>${v}</b></div>`).join('')||'<div class="empty">لا توجد بيانات</div>';
function vStats(){
 const P=vis(),ind=P.reduce((a,p)=>a+(+p.fam||0),0),got=P.filter(p=>p.last).length,byS={},byA={};
 P.forEach(p=>byS[p.status]=(byS[p.status]||0)+1);D.ai.filter(a=>all()?(fm==='all'||a.m===fm):a.m===ME.m).forEach(a=>byA[a.type]=(byA[a.type]||0)+1);
 const M=CF.mosques.filter(m=>all()?true:m.id===ME.m),mx=o=>Math.max(1,...Object.values(o));
 const rows=M.map(m=>{const x=D.pp.filter(p=>p.m===m.id);return{'المسجد':m.name,'الأسر':x.length,'الأفراد':x.reduce((a,p)=>a+(+p.fam||0),0),'مرشحون':x.filter(p=>p.nom).length,'استلموا':x.filter(p=>p.last).length}});
 $('#main').innerHTML=`<div class="tools">${mbar()}<button class="btn alt" id="xr">تصدير تقرير Excel</button></div><div class="grid"><div class="kpi big"><span>عدد الأسر</span><div>${P.length}</div></div><div class="kpi"><span>الأفراد</span><div>${ind}</div></div><div class="kpi"><span>مرشحون حالياً</span><div>${P.filter(p=>p.nom).length}</div></div><div class="kpi"><span>استلموا</span><div>${got}</div></div></div>
 <div class="card tw"><h2>حسب المسجد</h2><table><tr>${Object.keys(rows[0]||{}).map(k=>`<th>${k}</th>`).join('')}</tr>${rows.map(r=>'<tr>'+Object.values(r).map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join('')}</table></div>
 <div class="card"><h2>حسب الحالة</h2>${bars(byS,mx(byS))}</div><div class="card"><h2>حسب نوع الاستفادة</h2>${bars(byA,mx(byA))}</div>`;
 bfm();$('#xr').onclick=()=>xl(rows,'تقرير-إحصائي-'+today()+'.xlsx')}
const rowOut=p=>({'رقم الهوية':p.idno,'الاسم رباعي':p.name,'عدد الأفراد':p.fam,'رقم الجوال':p.phone,'المسجد':mname(p.m),'الحالة الاجتماعية':p.marital||'','رقم هوية الزوجة':p.wid||'','اسم الزوجة رباعي':p.wname||'','الحالة':p.status,'الأولوية':p.prio,'ملاحظات':p.note||'','آخر استلام':p.last||'','نوع آخر استفادة':p.lt||''});
function vPeople(){
 const L=vis().filter(p=>!q||[p.name,p.idno,p.phone].join(' ').includes(q)).sort((a,b)=>PR.indexOf(a.prio)-PR.indexOf(b.prio));
 $('#main').innerHTML=`<div class="tools">${mbar()}<input id="q" placeholder="بحث" value="${esc(q)}" style="flex:1;min-width:140px"><button class="btn" id="add">+ ${isM()?'إضافة':'طلب إضافة'}</button><button class="btn alt" id="imp">استيراد</button><button class="btn alt" id="exp">تصدير</button><button class="btn alt" id="tpl">نموذج</button></div>
 <div class="card tw">${L.length?`<table><tr><th>مرشّح</th><th>الاسم</th>${all()?'<th>المسجد</th>':''}<th>الجوال</th><th>الأفراد</th><th>الحالة</th><th>الأولوية</th><th>آخر استلام</th><th></th></tr>`+L.map(p=>`<tr><td><input type="checkbox" data-n="${p.id}" ${p.nom?'checked':''}></td><td>${esc(p.name)}</td>${all()?`<td>${esc(mname(p.m))}</td>`:''}<td>${esc(p.phone)}</td><td>${esc(p.fam)}</td><td><span class="tag">${esc(p.status)}</span></td><td><select data-p="${p.id}">${PR.map(x=>`<option ${x===p.prio?'selected':''}>${x}</option>`).join('')}</select></td><td>${esc(p.last||'—')}</td><td><button class="btn alt s" data-e="${p.id}">${isM()?'تعديل':'طلب تعديل'}</button> <button class="btn red s" data-d="${p.id}">${isM()?'حذف':'طلب حذف'}</button></td></tr>`).join('')+'</table>':'<div class="empty">لا توجد أسر</div>'}</div>`;
 bfm();$('#q').oninput=e=>{q=e.target.value;vPeople();const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)};
 const fp=id=>D.pp.find(x=>x.id===id);
 document.querySelectorAll('[data-n]').forEach(c=>c.onchange=()=>{const p=fp(c.dataset.n);set('pp',{...p,nom:c.checked});ev((c.checked?'ترشيح ':'إلغاء ترشيح ')+p.name+' – '+mname(p.m))});
 document.querySelectorAll('[data-p]').forEach(s=>s.onchange=()=>{const p=fp(s.dataset.p);set('pp',{...p,prio:s.value});ev('أولوية '+p.name+' ← '+s.value)});
 $('#add').onclick=()=>pdlg();document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>pdlg(b.dataset.e));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=fp(b.dataset.d);if(!confirm((isM()?'حذف ':'إرسال طلب حذف ')+p.name+'؟'))return;
  if(isM()){del('pp',p.id);ev('حذف '+p.name+' – '+mname(p.m))}else sendReq('del',p.m,{pid:p.id,pname:p.name})});
 $('#imp').onclick=()=>$('#file').click();
 $('#exp').onclick=()=>xl(L.map(rowOut),'سكان-'+today()+'.xlsx');
 $('#tpl').onclick=()=>xl([Object.fromEntries(Object.keys(rowOut({})).slice(0,8).map(k=>[k,'']))],'نموذج-استيراد.xlsx')}
function sendReq(type,m,x){set('rq',{id:uid('r'),type,m,by:ME.u,byName:ME.name,t:Date.now(),st:'pending',...x});ev('طلب '+RT[type]+' جديد – '+mname(m)+(x.pname?': '+x.pname:''));toast('أُرسل الطلب للمدير')}
function pdlg(id){
 const p=id?D.pp.find(x=>x.id===id):{id:uid('p'),m:all()?(fm==='all'?CF.mosques[0].id:fm):ME.m,name:'',idno:'',phone:'',fam:1,status:'محتاج',prio:'عادية',note:'',nom:false,last:''},d=$('#dlg');
 d.innerHTML=`<h2 style="margin-top:0">${id?'تعديل':'إضافة'} أسرة</h2><div class="f"><label class="w">الاسم<input id="f_name" value="${esc(p.name)}"></label><label>الهوية<input id="f_idno" value="${esc(p.idno)}"></label><label>الجوال<input id="f_phone" value="${esc(p.phone)}"></label><label>الأفراد<input id="f_fam" type="number" min="1" value="${esc(p.fam)}"></label><label>حالة الاحتياج<select id="f_status">${ST.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label>${all()?`<label>المسجد<select id="f_m">${mopts(p.m)}</select></label>`:''}<label>الحالة الاجتماعية<select id="f_marital">${['','متزوج','أرمل/ة','مطلق/ة','أعزب'].map(s=>`<option ${s===p.marital?'selected':''}>${s}</option>`).join('')}</select></label><label>رقم هوية الزوجة<input id="f_wid" value="${esc(p.wid)}"></label><label class="w">اسم الزوجة رباعي<input id="f_wname" value="${esc(p.wname)}"></label><label class="w">ملاحظات<input id="f_note" value="${esc(p.note)}"></label></div><div class="tools" style="margin:14px 0 0"><button class="btn" id="ok">${isM()?'حفظ':'إرسال للاعتماد'}</button><button class="btn alt" id="no">إلغاء</button></div>`;
 d.showModal();$('#no').onclick=()=>d.close();
 $('#ok').onclick=()=>{const g=k=>$('#f_'+k).value.trim();if(!g('name'))return toast('الاسم مطلوب');const n={...p,name:g('name'),idno:g('idno'),phone:g('phone'),fam:+g('fam')||1,status:g('status'),note:g('note'),marital:g('marital'),wid:g('wid'),wname:g('wname'),m:all()?g('m'):p.m};
  if(isM()){set('pp',n);ev((id?'تعديل ':'إضافة ')+n.name+' – '+mname(n.m))}else sendReq(id?'edit':'add',n.m,{data:n,pname:n.name});d.close()}}

 else{try{const k=a.dataset.csv;dl('sms-'+today()+'.csv',new Blob(['\ufeffphone,message\n'+SR[k].map(r=>`"${r.phone}","${smsMsg(k,r).replace(/"/g,'""')}"`).join('\n')],{type:'text/csv'}))}catch(x){}}});
