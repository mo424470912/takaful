<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%}

.content{flex:1;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px;margin-bottom:20px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:#d4ae83}
.kpi span{color:var(--mut);font-size:13px;font-weight:600}.kpi div{font-size:36px;font-weight:800;line-height:1.35;color:#4d3b29}
.kpi.big{background:linear-gradient(135deg,#8e6a47,#b58b60);color:#fff;border:0}.kpi.big::before{background:#f7dfb8}.kpi.big span{color:#fff1df}.kpi.big div{color:#fff}

.tools{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;align-items:center}
.btn{background:linear-gradient(135deg,#9b744e,#7e5c3d);color:#fff;border:0;border-radius:12px;padding:10px 17px;cursor:pointer;font-weight:700;box-shadow:0 5px 13px #80603c20;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn:active{transform:none}
.btn.alt{background:#f4ece1;color:#765738;border:1px solid #e9d8c3;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#e6c18e,#d4a36c);color:#4c3218}.btn.red{background:linear-gradient(135deg,#c85e53,#aa4038);color:white}.btn.s{padding:5px 11px;font-size:13px;border-radius:9px}
.tw{overflow-x:auto;border-radius:14px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}

td{padding:11px 12px;border-bottom:1px solid #f0e8de}tr:hover td{background:#fcf8f2}
.tag{background:#f3e9dc;color:#795b3b;border-radius:20px;padding:4px 11px;font-size:12px;white-space:nowrap;font-weight:700}.tag.ok{background:#e2f0e6;color:#39734e}.tag.no{background:#f9e4e0;color:#a63e35}.tag.w{background:#f7e7c9;color:#895b1c}
.log{border-inline-start:4px solid #e6d5c0;padding:12px 15px;margin:10px 0;background:#fffefa;border-radius:12px}.log.new{border-color:#c58b52;background:#fbf3e8}.log small{color:var(--mut)}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:24px;box-shadow:0 30px 80px -20px #4c37245c}dialog::backdrop{background:#3d30257a;backdrop-filter:blur(4px)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f label{display:grid;gap:6px;font-size:13px;color:#786957;font-weight:600}.f .w{grid-column:1/-1}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#493a2b;color:#fffaf2;padding:11px 19px;border-radius:14px;display:none;z-index:99;max-width:90vw;box-shadow:var(--sh)}
a.sms{color:#477e5a;font-weight:800;text-decoration:none}

body.out{background:radial-gradient(circle at 80% 0,#e9d7bf99,transparent 40%),radial-gradient(circle at 10% 100%,#f0e7d999,transparent 40%),#f7f4ee}
.out aside,.out .top{display:none}.out main{max-width:none;min-height:100vh;display:grid;place-items:center;padding:22px}
.login{width:min(430px,100%);margin:0;padding:32px;border-radius:25px;box-shadow:0 22px 70px #7e5c3d17}
.login .btn{min-height:43px}

@media(max-width:380px){nav button{font-size:10px;padding-inline:4px}.grid{grid-template-columns:1fr 1fr}.kpi div{font-size:27px}}
</style>

const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toISOString().slice(0,10);
const RN={manager:'مدير',admin:'إداري',member:'عضو'},ST=['محتاج','أرمل/ة','أيتام','مريض','كبير سن','عادي'],PR=['عالية','متوسطة','عادية'],AT=['كابونة','طرد غذائي','مساعدة نقدية','بطانيات','أخرى'],RT={add:'إضافة',edit:'تعديل',del:'حذف',imp:'استيراد'};
const MN=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];

const IC={stats:'<path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',nom:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>',aid:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',req:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',usr:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',ev:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
const mname=id=>(CF.mosques.find(m=>m.id===id)||{name:'—'}).name,isM=()=>ME.role==='manager',all=()=>ME.role!=='member';

const set=(c,o)=>DB.doc(c+'/'+o.id).set(o).catch(()=>toast('تعذر الحفظ')),del=(c,id)=>DB.doc(c+'/'+id).delete().catch(()=>toast('تعذر الحذف'));

const sec=()=>firebase.initializeApp(FIREBASE_CONFIG,'s'+Date.now()),fin=a=>{a.auth().signOut().catch(()=>{});a.delete().catch(()=>{})};
async function mkAcct(o){const a=sec();try{await a.auth().createUserWithEmailAndPassword(o.u+'@relief.app',o.pw);await set('ac',{id:o.u,u:o.u,name:o.name,phone:o.phone,role:o.role,m:o.m||'',t:Date.now()})}finally{fin(a)}}

const vis=()=>D.pp.filter(p=>all()?(fm==='all'||p.m===fm):p.m===ME.m);

 if(!ME||!(rdy.ac&&rdy.cf))return;

 ({stats:vStats,people:vPeople,nom:vNom,aid:vAid,req:vReq,usr:vUsr,ev:vEv,set:vSet})[tab]();

function login(){
 document.body.classList.add('out');
 $('#main').innerHTML=`<div class="card login"><div class="lg"><img src="logo.svg" alt="" onerror="this.style.display='none'"><h1>تكافل</h1><p>نظام إدارة لجنة الإغاثة</p></div><div class="f"><label class="w">اسم المستخدم<input id="l_u" dir="ltr"></label><label class="w">كلمة المرور<input id="l_p" type="password"></label></div><div class="tools" style="margin-top:12px"><button class="btn" id="l_ok">دخول</button><button class="btn alt s" id="l_s">أول تشغيل؟ إنشاء المدير</button></div></div>`;

 document.querySelectorAll('[data-r]').forEach(i=>i.onchange=()=>{if(i.value.trim())set('cf',{id:'main',...CF,mosques:CF.mosques.map(m=>m.id===i.dataset.r?{...m,name:i.value.trim()}:m)})});
 $('#ss').onclick=()=>{set('cf',{id:'main',...CF,sms:$('#sm').value});toast('تم الحفظ')}}
let AU,UN=[];const ld=u=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)});
async function libs(){for(const b of ['https://www.gstatic.com/firebasejs/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/','https://unpkg.com/firebase@10.12.2/']){try{for(const n of ['app','auth','firestore'])await ld(b+'firebase-'+n+'-compat.js');if(window.firebase)return true}catch(e){}}return false}
const on=(q,c)=>UN.push(q.onSnapshot(s=>{D[c]=s.docs.map(d=>d.data());rdy[c]=1;rd()},e=>{console.error(c,e);toast('تعذر تحميل '+c+': '+(e.code||''))}));
async function boot0(){
 if(typeof firebase==='undefined'&&!(await libs())){$('#main').innerHTML='<div class="empty">تعذر تحميل مكتبة Firebase من الإنترنت.<br>افتح الرابط في متصفح Chrome (وليس من داخل تطبيق)، وجرّب شبكة أخرى أو VPN.</div>';return}
 if(typeof XLSX==='undefined')ld('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').catch(()=>{});
 firebase.initializeApp(FIREBASE_CONFIG);AU=firebase.auth();DB=firebase.firestore();
 AU.onAuthStateChanged(async u=>{UN.forEach(f=>f());UN=[];ME=null;rdy={};D={pp:[],ac:[],rq:[],ai:[],ev:[]};$('#hd').innerHTML='';
 if(!u){$('#nav').innerHTML='';login();return}
 const un=u.email.split('@')[0];let a;try{a=(await DB.doc('ac/'+un).get()).data()}catch(e){}
 if(!a){toast('الحساب غير مفعّل');AU.signOut();return}
 ME=a;const C=c=>DB.collection(c),mem=a.role==='member';
 if(mem)UN.push(DB.doc('ac/'+un).onSnapshot(s=>{ME=s.data();D.ac=[ME];rdy.ac=1;rd()}));else on(C('ac'),'ac');
 on(mem?C('pp').where('m','==',a.m):C('pp'),'pp');on(mem?C('ai').where('m','==',a.m):C('ai'),'ai');on(mem?C('rq').where('by','==',un):C('rq'),'rq');
 if(a.role==='manager')on(C('ev'),'ev');else rdy.ev=1;
 UN.push(DB.doc('cf/main').onSnapshot(s=>{if(s.exists){const c=s.data();CF={mosques:c.mosques||CF.mosques,sms:c.sms||CF.sms}}else if(a.role==='manager')set('cf',{id:'main',...CF});rdy.cf=1;rd()},e=>toast('خطأ: '+(e.code||''))));
 draw()})}
boot0();
</script>
